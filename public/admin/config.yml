# Panel de NUDE (Decap CMS + Netlify Identity). Lo usa Soledad.
# Arriba van solo los campos que ella cambia; el resto, en el grupo plegado "Avanzado: no tocar".
# El sitio aplana `avanzado` al leer el contenido (lib/contenido.mjs).
backend:
  name: git-gateway
  branch: main

local_backend: true
locale: es

site_url: https://nudecosmetica.com
display_url: https://nudecosmetica.com
logo_url: /img/placeholder.svg

publish_mode: simple

media_folder: public/img/productos
public_folder: /img/productos

# Nombres de archivo de productos nuevos: a partir del nombre, sin tildes ni espacios.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: productos
    label: Productos
    label_singular: Producto
    folder: content/productos
    format: json
    # El slug (la dirección de la ficha) se arma solo a partir del nombre en productos nuevos.
    # En los existentes queda fijo (campo oculto en Avanzado).
    identifier_field: nombre
    slug: "{{slug}}"
    summary: "{{nombre}}"
    sortable_fields: [nombre, precio]
    create: true
    delete: false
    editor:
      preview: false
    fields:
      - { name: nombre, label: Nombre, widget: string }
      - name: precio
        label: Precio (en pesos, sin puntos ni decimales)
        hint: "Ejemplo: para $23.300 escribí 23300"
        widget: number
        value_type: int
        min: 1
        step: 1
      - name: disponible
        label: ¿Hay stock?
        hint: "Prendido = Sí, hay stock. Apagado = No (la ficha muestra «Sin stock» y el botón de WhatsApp)."
        widget: boolean
        default: true
      - name: imagenes
        label: Fotos (la primera es la principal)
        label_singular: Foto
        hint: "Arrastrá para cambiar el orden. Tiene que haber al menos una."
        widget: list
        collapsed: false
        # Con min y max Decap valida el rango también con la lista vacía (solo con min, no).
        min: 1
        max: 10
        field: { name: imagen, label: Foto, widget: image }
      - { name: tamano, label: Tamaño, hint: "Ejemplo: 30 ml. Si no lo sabés, dejalo vacío.", widget: string, required: false }
      - { name: resumen, label: Descripción corta, widget: text }
      - { name: ingredientes, label: Ingredientes, widget: text }
      - { name: modoDeUso, label: Cómo se usa, widget: text }
      - name: avanzado
        label: "Avanzado: no tocar (lo maneja Kosmos)"
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: slug, label: Slug, widget: hidden }
          - name: categoria
            label: Categoría
            widget: select
            required: false
            options:
              - { label: Cosmética facial, value: face }
              - { label: Cosmética corporal, value: body }
              - { label: Sets y regalos, value: sets }
              - { label: Accesorios, value: accesorios }
          - { name: h1, label: Título grande (H1), widget: string, required: false }
          - { name: pasoRutina, label: Paso en la rutina (1 a 5), widget: number, value_type: int, min: 1, max: 5, required: false }
          - name: activos
            label: Activos
            widget: list
            required: false
            fields:
              - { name: nombre, label: Nombre, widget: string }
              - { name: queHace, label: Qué hace, widget: text }
          - { name: beneficios, label: Beneficios, widget: list, required: false, field: { name: beneficio, label: Beneficio, widget: string } }
          - name: faq
            label: Preguntas frecuentes
            widget: list
            required: false
            fields:
              - { name: q, label: Pregunta, widget: string }
              - { name: a, label: Respuesta, widget: text }
          - { name: relacionados, label: Relacionados (slugs), widget: list, required: false, field: { name: slug, label: Slug, widget: string } }
          - { name: incluye, label: Incluye (slugs, solo kits), widget: list, required: false, field: { name: slug, label: Slug, widget: string } }
          - name: seo
            label: SEO
            widget: object
            required: false
            fields:
              - { name: title, label: Title (Google), widget: string, required: false }
              - { name: description, label: Description (Google), widget: text, required: false }
          - { name: avisoPatch, label: Aviso de prueba de parche, widget: boolean, default: true, required: false }
          - { name: fichaCorta, label: Ficha corta, widget: boolean, default: false, required: false }
          - { name: tiendanubeUrl, label: URL en Tiendanube (plan B), widget: string, required: false }

  - name: ajustes
    label: Ajustes
    editor:
      preview: false
    files:
      - name: tienda
        label: Pagos y WhatsApp
        file: content/ajustes/tienda.json
        format: json
        fields:
          - { name: alias, label: Alias, hint: "Alias de la cuenta para transferencias.", widget: string, required: false }
          - { name: titularCuenta, label: Titular, hint: "Nombre de la persona titular de la cuenta.", widget: string, required: false }
          - { name: cbu, label: CBU, hint: "Los 22 números, sin espacios.", widget: string, required: false }
          - { name: whatsapp, label: WhatsApp, hint: "Con +54 9 adelante, por ejemplo +5493517033348.", widget: string }
          - name: avanzado
            label: "Avanzado: no tocar (lo maneja Kosmos)"
            widget: object
            collapsed: true
            fields:
              - { name: descuentoTransferencia, label: Descuento por transferencia (0.20 = 20%), widget: number, value_type: float, min: 0, max: 1, step: 0.01 }
              - name: descuentoCantidad
                label: Descuento por cantidad
                widget: object
                fields:
                  - { name: minUnidades, label: Mínimo de unidades, widget: number, value_type: int, min: 1 }
                  - { name: porcentaje, label: Porcentaje (0.05 = 5%), widget: number, value_type: float, min: 0, max: 1, step: 0.01 }
              - { name: descuentosAcumulables, label: ¿Los descuentos se acumulan?, widget: boolean, default: false }
              - { name: cuotasTexto, label: Texto de cuotas (solo con Mercado Pago encendido), widget: string }
              - { name: horasReservaTransferencia, label: Horas de reserva con transferencia, widget: number, value_type: int, min: 1, max: 168 }
              - { name: emailTienda, label: Email de la tienda, widget: string }

      - name: envios
        label: Costos de envío
        file: content/ajustes/envios.json
        format: json
        fields:
          - name: zonas
            label: Zonas de envío
            label_singular: Zona
            widget: list
            summary: "{{fields.nombre}}"
            # Las zonas se ven abiertas y no se agregan ni borran desde el panel (las maneja Kosmos).
            collapsed: false
            allow_add: false
            allow_remove: false
            allow_reorder: false
            fields:
              - { name: nombre, label: Nombre visible, widget: string }
              - name: costo
                label: Costo (en pesos, sin puntos)
                hint: "Vacío o 0 = «a coordinar por WhatsApp»."
                widget: number
                value_type: int
                min: 0
                step: 1
                required: false
              - { name: plazoTexto, label: Plazo de entrega, hint: "Ejemplo: 3 a 5 días hábiles. Si lo dejás vacío no se muestra plazo.", widget: string, required: false }
              - name: avanzado
                label: "Avanzado: no tocar (lo maneja Kosmos)"
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: id, label: ID interno, widget: string, required: false }
                  - { name: provincias, label: Provincias, widget: list, required: false, field: { name: provincia, label: Provincia, widget: string } }
                  - { name: codigosPostales, label: Códigos postales, widget: list, required: false, field: { name: cp, label: Código postal, widget: string } }
          - name: avanzado
            label: "Avanzado: no tocar (lo maneja Kosmos)"
            widget: object
            collapsed: true
            required: false
            fields:
              - name: retiro
                label: Retiro en Mendiolaza
                widget: object
                fields:
                  - { name: habilitado, label: Habilitado, widget: boolean, default: false }
                  - { name: direccionTexto, label: Texto del retiro, widget: text, required: false }
                  - { name: costo, label: Costo (0 si es gratis), widget: number, value_type: int, min: 0, required: false }
              - { name: envioGratisDesde, label: Envío gratis desde (vacío = no hay), widget: number, value_type: int, required: false }
