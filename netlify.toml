[build]
command = "npm run build"
publish = "out"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "20"
NPM_FLAGS = "--legacy-peer-deps"

[functions]
node_bundler = "esbuild"
included_files = ["netlify/functions/_data/**", "content/**"]

# 404 real para rutas que no existen (Next export genera 404.html).
[[redirects]]
from = "/*"
to = "/404.html"
status = 404
